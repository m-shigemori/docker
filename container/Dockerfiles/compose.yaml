x-base: &base_config
  container_name: ${NAME}

  build:
    context: .
    args:
      ROS_DISTRO: ${ROS_DISTRO}
      USER_NAME: ${USER_NAME}
      USER_ID: ${USER_ID}
      GROUP_ID: ${GROUP_ID}

  stdin_open: true
  tty: true

  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ../src:/home/${USER_NAME}/colcon_ws/src

  environment:
    CONTAINER_NAME: ${NAME}
    DISPLAY: ${DISPLAY}

services:
  cpu:
    <<: *base_config
    profiles: ["cpu"]
    image: ${IMAGE_NAME}:cpu

  gpu:
    <<: *base_config
    profiles: ["gpu"]
    image: ${IMAGE_NAME}:gpu
