x-base: &base_config
  container_name: ${NAME}

  build:
    context: .
    args:
      CUDA_VER:      ${CUDA_VER}
      DEVICE:        ${DEVICE}
      USER_NAME:     ${USER_NAME}
      USER_ID:       ${USER_ID}
      GROUP_ID:      ${GROUP_ID}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}

  user: "${USER_ID}:${GROUP_ID}"
  network_mode: host
  privileged: true
  stdin_open: true
  tty: true

  environment:
    CONTAINER_NAME:  ${NAME}
    DISPLAY:         ${DISPLAY}
    WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
    XDG_RUNTIME_DIR: /run/user/${USER_ID}
    PULSE_SERVER:    unix:/run/user/${USER_ID}/pulse/native

  volumes:
    - /dev:/dev
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /run/user/${USER_ID}/${WAYLAND_DISPLAY}:/run/user/${USER_ID}/${WAYLAND_DISPLAY}
    - /run/user/${USER_ID}/pulse:/run/user/${USER_ID}/pulse
    - ../src:/home/${USER_NAME}/colcon_ws/src

services:
  cpu:
    <<: *base_config
    profiles: ["cpu"]
    image: ${IMAGE_NAME}:cpu

  gpu:
    <<: *base_config
    profiles: ["gpu"]
    image: ${IMAGE_NAME}:gpu
    gpus: all